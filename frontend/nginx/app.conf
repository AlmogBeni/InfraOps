# Application locations and headers, shared by the HTTP and HTTPS servers.
# Included from /etc/nginx/infraops/http-mode.conf and the generated HTTPS server.

root /usr/share/nginx/html;
index index.html;

access_log /var/log/nginx/access.log infraops;

# Security headers
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

gzip on;
gzip_types text/plain text/css application/json application/javascript image/svg+xml;

# Container-local liveness probe. Keep this independent of the backend so
# Docker reports the frontend's health rather than the API's health.
location = /frontend-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Server-Sent Events stream — disable buffering so events flush immediately
location ~ ^/api/v1/provisioning/jobs/[^/]+/events$ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwrite (never append to) client-supplied forwarding headers.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
}

# REST API
location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 300s;
}

location = /health {
    proxy_pass http://backend:8000;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# SPA fallback
location / {
    try_files $uri $uri/ /index.html;
}
