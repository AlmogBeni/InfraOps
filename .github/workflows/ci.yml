name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: infraops
          POSTGRES_PASSWORD: infraops-ci
          POSTGRES_DB: infraops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U infraops -d infraops"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      ENVIRONMENT: development
      INFRASTRUCTURE_MODE: mock
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      COOKIE_SECURE: "false"
      REDIS_URL: redis://localhost:6379/0
      MIGRATION_DATABASE_URL: postgresql+asyncpg://infraops:infraops-ci@localhost:5432/infraops
      DATABASE_URL: postgresql+asyncpg://infraops_app:infraops-app-ci@localhost:5432/infraops
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests migrations
      - name: Migrate (upgrade, downgrade one step, upgrade)
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
      - name: Models match migrations
        run: alembic check
      - name: Provision least-privilege runtime role
        run: python -m app.db.roles
      - name: Unit tests
        run: pytest
      - name: Database integration tests (runtime role)
        env:
          INFRAOPS_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pytest tests/integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run bundle

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t infraops-backend:ci backend
      - name: Build frontend image
        run: docker build -t infraops-frontend:ci frontend
      - name: Validate rendered nginx configuration
        run: >
          docker run --rm --add-host backend:127.0.0.1
          -e TRUSTED_PROXY_CIDR=172.16.0.0/12
          infraops-frontend:ci nginx -t
      - name: Validate compose file
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/' .env
          docker compose config --quiet
