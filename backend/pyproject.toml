[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "UP042",  # str-mixin enums are persisted/serialised by value; StrEnum changes str()
    "UP046",  # keep explicit Generic[...] for readability
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
